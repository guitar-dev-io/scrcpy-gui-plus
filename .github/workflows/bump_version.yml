on:
  workflow_dispatch:
    inputs:
      bump_type:
        description: 'Type of version bump'
        required: true
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major

jobs:
  bump:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Git Config
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Bump package.json version
        run: |
          npm version ${{ github.event.inputs.bump_type }} --no-git-tag-version
          NEW_VERSION=$(node -p "require('./package.json').version")
          echo "NEW_VERSION=$NEW_VERSION" >> $GITHUB_ENV

      - name: Update package-lock.json
        run: npm install --package-lock-only

      - name: Update tauri.conf.json
        run: |
          jq ".version = \"${{ env.NEW_VERSION }}\"" src-tauri/tauri.conf.json > src-tauri/tauri.conf.json.tmp && mv src-tauri/tauri.conf.json.tmp src-tauri/tauri.conf.json

      - name: Update Cargo.toml
        run: |
          sed -i "s/^version = \".*\"/version = \"${{ env.NEW_VERSION }}\"/" src-tauri/Cargo.toml

      - name: Update Android version metadata
        run: |
          VERSION_CODE=$(NEW_VERSION="$NEW_VERSION" node -e '
            const match = /^(\\d+)\\.(\\d+)\\.(\\d+)$/.exec(process.env.NEW_VERSION);
            if (!match) throw new Error(`Unsupported release version: ${process.env.NEW_VERSION}`);
            const code = Number(match[1]) * 1000000 + Number(match[2]) * 1000 + Number(match[3]);
            if (!Number.isSafeInteger(code) || code <= 0 || code > 2100000000) {
              throw new Error(`Android versionCode is out of range: ${code}`);
            }
            process.stdout.write(String(code));
          ')
          {
            echo "versionCode=$VERSION_CODE"
            echo "versionName=$NEW_VERSION"
          } > android-companion/version.properties

      - name: Commit and push
        run: |
          git add package.json package-lock.json src-tauri/tauri.conf.json src-tauri/Cargo.toml android-companion/version.properties
          git commit -m "chore: bump version to v${{ env.NEW_VERSION }}"
          git push

      - name: Create and push release tag
        run: |
          git tag -a "v${{ env.NEW_VERSION }}" -m "Release v${{ env.NEW_VERSION }}"
          git push origin "v${{ env.NEW_VERSION }}"
