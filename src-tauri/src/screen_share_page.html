<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="color-scheme" content="dark">
<title>__TITLE__</title>
<style>
:root{
  --bg:#05070b;--ink:#e8ebf2;--muted:#8b93a7;--line:rgba(255,255,255,.09);
  --glass:rgba(255,255,255,.055);--accent:#ff5a5f;--ok:#34d399;--warn:#fbbf24;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{
  display:flex;align-items:center;justify-content:center;overflow:hidden;
  color:var(--ink);font:13px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,system-ui,sans-serif;
  background:
    radial-gradient(900px 600px at 15% 10%,rgba(255,90,95,.10),transparent 60%),
    radial-gradient(800px 600px at 90% 95%,rgba(99,102,241,.12),transparent 60%),
    var(--bg);
}
.chip{
  position:fixed;top:max(14px,env(safe-area-inset-top));left:14px;z-index:5;
  display:flex;align-items:center;gap:9px;max-width:calc(100vw - 28px);
  padding:7px 12px 7px 10px;border-radius:999px;background:var(--glass);
  border:1px solid var(--line);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
}
.chip b{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dot{width:8px;height:8px;border-radius:50%;background:var(--warn);flex:none;
  box-shadow:0 0 0 0 rgba(251,191,36,.5);animation:pulse 1.8s infinite}
.live .dot{background:var(--ok);box-shadow:0 0 0 0 rgba(52,211,153,.5)}
@keyframes pulse{70%{box-shadow:0 0 0 7px transparent}100%{box-shadow:0 0 0 0 transparent}}
.badge{flex:none;font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;
  padding:2px 7px;border-radius:999px;color:var(--muted);border:1px solid var(--line)}
.control .badge{color:var(--accent);border-color:rgba(255,90,95,.4);background:rgba(255,90,95,.08)}
.deck{display:flex;align-items:center;gap:22px;padding:14px}
.device{
  position:relative;padding:11px;border-radius:44px;
  background:linear-gradient(160deg,#2b3242,#12161f 55%,#1b2130);
  box-shadow:0 0 0 1px rgba(255,255,255,.10),0 0 0 6px #0b0e15,
    0 0 0 7px rgba(255,255,255,.06),0 40px 90px rgba(0,0,0,.65),0 0 120px rgba(255,90,95,.07);
}
.device::before{ /* speaker slit */
  content:"";position:absolute;top:4px;left:50%;width:44px;height:4px;margin-left:-22px;
  border-radius:4px;background:#05070b;opacity:.9;
}
.screen{
  position:relative;line-height:0;overflow:hidden;border-radius:33px;background:#000;
  min-width:min(66vw,250px);min-height:min(60vh,500px);
}
#s{
  display:block;border-radius:33px;user-select:none;-webkit-user-select:none;
  max-width:min(88vw,430px);max-height:calc(100dvh - 92px);
  opacity:0;transition:opacity .35s ease;
}
.live #s{opacity:1}
#fx{position:absolute;inset:0;touch-action:none;overflow:hidden}
.control #fx{cursor:pointer}
.wait{
  position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:12px;color:var(--muted);line-height:1.4;background:radial-gradient(circle at 50% 40%,#10141d,#05070b);
  transition:opacity .35s ease;pointer-events:none;text-align:center;padding:20px
}
.live .wait{opacity:0}
.spin{width:26px;height:26px;border-radius:50%;border:2.5px solid rgba(255,255,255,.12);
  border-top-color:var(--accent);animation:rot .9s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}
.rip{position:absolute;width:46px;height:46px;margin:-23px 0 0 -23px;border-radius:50%;pointer-events:none;
  background:radial-gradient(circle,rgba(255,255,255,.55),rgba(255,90,95,.35) 55%,transparent 70%);
  animation:rip .5s ease-out forwards}
@keyframes rip{from{transform:scale(.3);opacity:1}to{transform:scale(1.5);opacity:0}}
.tr{position:absolute;width:12px;height:12px;margin:-6px 0 0 -6px;border-radius:50%;pointer-events:none;
  background:rgba(255,255,255,.55);animation:tr .45s ease-out forwards}
@keyframes tr{to{transform:scale(.3);opacity:0}}
.rail{
  display:flex;flex-direction:column;gap:8px;padding:9px;border-radius:24px;
  background:var(--glass);border:1px solid var(--line);
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
}
.rail i{display:block;height:1px;margin:2px 6px;background:var(--line)}
button{
  position:relative;display:flex;align-items:center;justify-content:center;width:46px;height:46px;padding:0;
  border:1px solid transparent;border-radius:16px;background:transparent;color:var(--ink);cursor:pointer;
  transition:background .15s,border-color .15s,transform .1s,color .15s;
}
button:hover{background:rgba(255,255,255,.09);border-color:var(--line)}
button:active,button.hit{transform:scale(.92);background:rgba(255,90,95,.2);border-color:rgba(255,90,95,.5);color:#fff}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
button::after{ /* tooltip */
  content:attr(data-tip);position:absolute;right:calc(100% + 10px);top:50%;transform:translateY(-50%);
  padding:4px 9px;border-radius:8px;background:#0b0e15;border:1px solid var(--line);color:var(--ink);
  font-size:11px;white-space:nowrap;opacity:0;pointer-events:none;transition:opacity .15s
}
button:hover::after{opacity:1}
.toast{
  position:fixed;left:50%;bottom:max(18px,env(safe-area-inset-bottom));transform:translate(-50%,20px);
  padding:8px 14px;border-radius:12px;background:#1a0f12;border:1px solid rgba(255,90,95,.45);
  color:#ffb4b6;opacity:0;pointer-events:none;transition:.25s;z-index:9
}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast.ok{background:#0d1a14;border-color:rgba(52,211,153,.45);color:#a7f3d0}
@media (max-width:640px){
  .deck{flex-direction:column;gap:12px;padding:52px 8px 8px}
  .rail{flex-direction:row;padding:7px;gap:4px}
  .rail i{width:1px;height:auto;margin:6px 2px}
  button{width:44px;height:44px}
  button::after{display:none}
  #s{max-height:calc(100dvh - 200px)}
  .device{padding:8px;border-radius:36px}.screen,#s{border-radius:28px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body class="__MODE__">
<div class="chip" id="chip"><span class="dot"></span><b>__TITLE__</b><span class="badge">__BADGE__</span></div>
<main class="deck">
  <div class="device">
    <div class="screen">
      <img id="s" alt="__TITLE__" draggable="false" src="__BASE__/stream">
      <div id="fx"></div>
      <div class="wait" id="wait"><div class="spin"></div><span id="waitmsg">Connecting to device…</span></div>
    </div>
  </div>
  <nav class="rail" aria-label="Device controls">
<!--control-->
    <button data-k="back" data-tip="Back (Esc)" aria-label="Back"><svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg></button>
    <button data-k="home" data-tip="Home (Home)" aria-label="Home"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="7"/></svg></button>
    <button data-k="recents" data-tip="Recents (End)" aria-label="Recents"><svg viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="2.5"/></svg></button>
    <i></i>
    <button data-k="volume_up" data-tip="Volume up (PgUp)" aria-label="Volume up"><svg viewBox="0 0 24 24"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="M15.5 9a4 4 0 0 1 0 6"/><path d="M18.5 6.5a8 8 0 0 1 0 11"/></svg></button>
    <button data-k="volume_down" data-tip="Volume down (PgDn)" aria-label="Volume down"><svg viewBox="0 0 24 24"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="M16 12h4"/></svg></button>
    <i></i>
<!--/control-->
    <button id="cap" data-tip="Capture screenshot" aria-label="Capture screenshot"><svg viewBox="0 0 24 24"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg></button>
    <button id="fs" data-tip="Fullscreen" aria-label="Fullscreen"><svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
  </nav>
</main>
<div class="toast" id="toast" role="status"></div>
<script>
(()=>{
const base="__BASE__",$=id=>document.getElementById(id);
const img=$("s"),wait=$("wait"),waitmsg=$("waitmsg"),toast=$("toast");
let live=false,retry=0;
const setLive=on=>{
  if(on===live)return;live=on;
  document.body.classList.toggle("live",on);
  if(!on)waitmsg.textContent="Reconnecting…";
};
img.addEventListener("load",()=>{retry=0;setLive(true)});
img.addEventListener("error",()=>{
  setLive(false);
  setTimeout(()=>{img.src=base+"/stream?t="+Date.now()},Math.min(5000,1000+retry++*800));
});
// Some browsers never fire load for a multipart stream, so also watch the size.
setInterval(()=>{if(img.naturalWidth>0)setLive(true)},600);
$("fs").addEventListener("click",()=>{
  const d=document;
  if(d.fullscreenElement){d.exitFullscreen()}
  else (d.documentElement.requestFullscreen||(()=>{})).call(d.documentElement);
});
let toastTimer;
const say=(m,ok)=>{toast.textContent=m;toast.classList.toggle("ok",!!ok);toast.classList.add("show");
  clearTimeout(toastTimer);toastTimer=setTimeout(()=>toast.classList.remove("show"),2400)};
let capturing=false;
$("cap").addEventListener("click",async()=>{
  if(capturing||!live)return;capturing=true;$("cap").classList.add("hit");
  try{
    const r=await fetch(base+"/capture.png",{cache:"no-store"});
    if(!r.ok)throw new Error(r.status);
    const name=((r.headers.get("Content-Disposition")||"").match(/filename="([^"]+)"/)||[])[1]||"screenshot.png";
    const url=URL.createObjectURL(await r.blob());
    const a=document.createElement("a");a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),10000);say("Saved "+name,true);
  }catch(e){say("Could not capture the screen")}
  finally{capturing=false;$("cap").classList.remove("hit")}
});
<!--control-->
const key="__KEY__",fx=$("fx");
const clamp=v=>Math.min(1,Math.max(0,v));
const point=e=>{const r=fx.getBoundingClientRect();
  return{x:clamp((e.clientX-r.left)/r.width),y:clamp((e.clientY-r.top)/r.height),
    px:e.clientX-r.left,py:e.clientY-r.top,t:Date.now()}};
const send=q=>fetch(base+"/input?k="+key+"&"+q,{method:"POST"}).then(r=>{
  if(r.status===403)say("Control is not allowed for this link");
  else if(!r.ok)say("The device did not accept that input");
}).catch(()=>say("Lost connection to the host"));
const spot=(cls,x,y,ms)=>{const n=document.createElement("i");n.className=cls;
  n.style.left=x+"px";n.style.top=y+"px";fx.appendChild(n);setTimeout(()=>n.remove(),ms)};
let start=null,lastTrail=0;
fx.addEventListener("contextmenu",e=>e.preventDefault());
fx.addEventListener("pointerdown",e=>{
  if(e.button>0)return;e.preventDefault();fx.setPointerCapture(e.pointerId);
  start=point(e);spot("rip",start.px,start.py,520);
});
fx.addEventListener("pointermove",e=>{
  if(!start)return;const n=Date.now();
  if(n-lastTrail<24)return;lastTrail=n;const p=point(e);spot("tr",p.px,p.py,450);
});
fx.addEventListener("pointerup",e=>{
  if(!start)return;const a=start,b=point(e);start=null;
  const dur=Math.max(60,Math.min(2000,b.t-a.t));
  const moved=Math.hypot(b.x-a.x,b.y-a.y)>0.02;
  const f=v=>v.toFixed(4);
  if(!moved&&dur<400)send("a=tap&x="+f(a.x)+"&y="+f(a.y));
  else send("a=swipe&x="+f(a.x)+"&y="+f(a.y)+"&x2="+f(b.x)+"&y2="+f(b.y)+"&d="+dur);
});
fx.addEventListener("pointercancel",()=>{start=null});
// Wheel / trackpad scrolling becomes a short swipe, like a finger flick on a phone.
let wheelX=0,wheelY=0,wheelAt=null,wheelTimer=0,wheelBusy=false;
fx.addEventListener("wheel",e=>{
  e.preventDefault();
  const unit=e.deltaMode===1?32:e.deltaMode===2?fx.clientHeight:1;
  wheelX+=e.deltaX*unit;wheelY+=e.deltaY*unit;
  const r=fx.getBoundingClientRect();
  wheelAt={x:clamp((e.clientX-r.left)/r.width),y:clamp((e.clientY-r.top)/r.height)};
  if(!wheelTimer)wheelTimer=setTimeout(flushWheel,90);
},{passive:false});
async function flushWheel(){
  wheelTimer=0;
  if(wheelBusy){wheelTimer=setTimeout(flushWheel,90);return}
  const r=fx.getBoundingClientRect(),at=wheelAt;
  const dy=wheelY/r.height*1.1,dx=wheelX/r.width*1.1;wheelX=wheelY=0;
  if(Math.abs(dx)<.01&&Math.abs(dy)<.01)return;
  // Content follows the wheel, so the finger moves the opposite way.
  const cap=v=>Math.sign(v)*Math.min(.6,Math.max(.14,Math.abs(v)));
  const vy=Math.abs(dy)>=.01?cap(dy):0,vx=Math.abs(dx)>=.01?cap(dx):0;
  // Stay off the screen edges, where the system claims swipes for its own gestures.
  const inset=v=>Math.min(.9,Math.max(.1,v));
  const x1=inset(at.x+vx/2),y1=inset(at.y+vy/2),x2=inset(x1-vx),y2=inset(y1-vy);
  const f=v=>v.toFixed(4),dur=Math.round(180+Math.hypot(vx,vy)*500);
  wheelBusy=true;
  await send("a=swipe&x="+f(x1)+"&y="+f(y1)+"&x2="+f(x2)+"&y2="+f(y2)+"&d="+dur);
  wheelBusy=false;
}
const press=name=>{
  const b=document.querySelector('button[data-k="'+name+'"]');
  if(b){b.classList.add("hit");setTimeout(()=>b.classList.remove("hit"),160)}
  send("a=key&code="+name);
};
document.querySelectorAll("button[data-k]").forEach(b=>b.addEventListener("click",()=>press(b.dataset.k)));
const keys={Escape:"back",Home:"home",End:"recents",PageUp:"volume_up",PageDown:"volume_down"};
const scrollKeys={ArrowUp:"x=.5&y=.35&x2=.5&y2=.65",ArrowDown:"x=.5&y=.65&x2=.5&y2=.35",ArrowLeft:"x=.3&y=.5&x2=.7&y2=.5",ArrowRight:"x=.7&y=.5&x2=.3&y2=.5"};
addEventListener("keydown",e=>{
  if(scrollKeys[e.key]){e.preventDefault();send("a=swipe&"+scrollKeys[e.key]+"&d=260");return}
  const name=keys[e.key];if(!name||e.repeat)return;e.preventDefault();press(name);
});
<!--/control-->
})();
</script>
</body>
</html>
